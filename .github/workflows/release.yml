# Pushing a tag vX.Y.Z publishes release X.Y.Z (F2): the six executables, with
# their SHA256SUMS, on the GitHub release of the tag, and the image
# wayhowma/bazarrbulksync:X.Y.Z on Docker Hub, also tagged latest when X.Y.Z
# is the newest version. The tag's section of CHANGELOG.md, then the image's
# tag, become the release notes. It needs the repository secrets
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token that can
# push to wayhowma/bazarrbulksync).
# Nothing is published until every check has passed, and the image pushes can
# be repeated, so a failed run can be re-run once its cause is fixed; if it
# failed while creating the GitHub release, delete that release first.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

# One release at a time, so two runs never race to move `latest`.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"
  IMAGE: wayhowma/bazarrbulksync

jobs:
  release:
    name: Build, check, and publish
    runs-on: ubuntu-24.04
    steps:
      - name: Check the Docker Hub secrets are set
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, then re-run this workflow. Nothing was published."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: |
          go vet ./...
          go test ./...
      - name: Take the version from the tag and the notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # The section runs from its heading to the next version's heading
          # or the link definitions at the end of the file.
          awk -v heading="## [$version]" '
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found
            $0 == heading || index($0, heading " ") == 1 { found = 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section headed '## [$version]'."
            exit 1
          fi
          printf "\nContainer image: \`%s:%s\`\n" "$IMAGE" "$version" >> "$RUNNER_TEMP/notes.md"
      # `go run ./release` builds both image platforms into the local image
      # store, which only the containerd image store can hold.
      - name: Switch Docker to the containerd image store
        run: |
          { sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}'; } \
            | jq '.features["containerd-snapshotter"] = true' > "$RUNNER_TEMP/daemon.json"
          sudo cp "$RUNNER_TEMP/daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info -f '{{.DriverStatus}}' | grep -q io.containerd.snapshotter
      - name: Build the executables and the image
        run: go run ./release "$VERSION"
      - name: Check what was built
        run: |
          BAZARRBULKSYNC_RELEASE="$VERSION" go test -count=1 ./release
          # The image's entry point is the command, stamped with the version.
          test "$(docker run --rm "$IMAGE:$VERSION" --version)" = "bazarrbulksync $VERSION"
          cd release/out
          sha256sum bazarrbulksync-* > SHA256SUMS
      - uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker push "$IMAGE:$VERSION"
          platforms=$(docker manifest inspect "$IMAGE:$VERSION" | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"')
          for p in linux/amd64 linux/arm64; do
            if ! grep -qx "$p" <<< "$platforms"; then
              echo "::error::$IMAGE:$VERSION on Docker Hub has no $p image."
              exit 1
            fi
          done
          # `latest` follows the newest version, so re-running an older
          # release, or releasing a fix to an older line, leaves it alone.
          newest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref' \
            | sed -n 's|^refs/tags/v\([0-9]*\.[0-9]*\.[0-9]*\)$|\1|p' | sort -V | tail -n 1)
          if [ "$newest" = "$VERSION" ]; then
            docker push "$IMAGE:latest"
          else
            echo "::notice::$VERSION is older than $newest, so $IMAGE:latest is left as it is."
          fi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release/out
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            bazarrbulksync-* SHA256SUMS
